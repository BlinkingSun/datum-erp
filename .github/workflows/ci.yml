name: ci

on:
  push:
    branches: [main]
  pull_request:

# Remote Actions stay off; the orchestrator runs this locally on three nodes first.
permissions:
  contents: read

jobs:
  ci:
    name: just ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: just ci
        run: just ci

  ci-db:
    name: just ci-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wicket_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WICKET_REQUIRE_PG: "1"
      WICKET_BOOTSTRAP_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
      WICKET_DATABASE_URL: postgres://wicket_app:wicket@127.0.0.1:5432/wicket_test?sslmode=disable
      WICKET_MIGRATE_DATABASE_URL: postgres://wicket_migrate:wicket@127.0.0.1:5432/wicket_test?sslmode=disable
      WICKET_TEST_TEMPLATE: wicket_test_template
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install ripgrep and postgresql-client
        run: sudo apt-get update && sudo apt-get install -y ripgrep postgresql-client
      - name: just db-reset then just ci-db
        run: just db-reset && just ci-db

  lint-policy:
    name: lint-policy
    runs-on: ubuntu-latest
    steps:
      # Default pull_request checkout is the merge commit GitHub creates,
      # which has no Signed-off-by. Inspect the PR head (or the push SHA).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check DCO sign-off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            bash scripts/check-dco.sh "origin/${BASE_REF}..HEAD"
          else
            zeros=0000000000000000000000000000000000000000
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zeros" ]; then
              bash scripts/check-dco.sh HEAD
            else
              git fetch --no-tags origin "$BEFORE" 2>/dev/null || true
              bash scripts/check-dco.sh "${BEFORE}..${SHA}"
            fi
          fi

      - name: Check pull-request goal headings
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-pr-goals.sh

      - name: Scan for unimplemented macros
        run: bash scripts/lint-unimplemented.sh

      - name: Module manifest identity
        run: bash scripts/lint-module-manifests.sh
