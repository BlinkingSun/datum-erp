# Raw-SQL fence (CONTRACT §5a, D3 §11). datum-db and datum-audit opt out in crate
# rustc attributes; just lint-sql is the string-level backstop.
disallowed-macros = [
    { path = "sqlx::query", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
    { path = "sqlx::query_as", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
    { path = "sqlx::query_scalar", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
]
disallowed-methods = [
    { path = "sqlx::query", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
    { path = "sqlx::query_as", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
    { path = "sqlx::query_scalar", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
    { path = "sqlx::raw_sql", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
    { path = "sqlx::QueryBuilder::new", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
    { path = "sqlx::postgres::PgConnection::copy_in_raw", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
]
disallowed-types = [
    { path = "sqlx::QueryBuilder", reason = "raw SQL is confined to datum-db and datum-audit (D3 §11)", allow-invalid = true },
]
