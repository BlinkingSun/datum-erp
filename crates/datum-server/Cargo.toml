[package]
name = "datum-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP API process: composition root, OpenAPI, and the Wave 2s slice."
build = "build.rs"

[lints]
workspace = true

[features]
default = []
test-utils = []

[[bin]]
name = "datum"
path = "src/main.rs"

[dependencies]
datum-core.workspace = true
datum-db.workspace = true
datum-audit.workspace = true
datum-identity.workspace = true
datum-numbering.workspace = true
datum-uom.workspace = true
datum-events.workspace = true
datum-jobs.workspace = true
datum-ledger.workspace = true
datum-statemachine.workspace = true
datum-esign.workspace = true
datum-customfields.workspace = true
datum-documents.workspace = true
datum-print.workspace = true
datum-module.workspace = true
datum-mod-items = { path = "../../modules/items" }
datum-mod-locations = { path = "../../modules/locations" }
datum-mod-lots = { path = "../../modules/lots" }
datum-mod-inventory = { path = "../../modules/inventory" }
datum-mod-production-min = { path = "../../modules/production_min" }
datum-mod-genealogy = { path = "../../modules/genealogy" }
sqlx.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
clap.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true

[dev-dependencies]
datum-test.workspace = true
tokio.workspace = true
proptest.workspace = true
