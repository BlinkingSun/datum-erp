[package]
name = "wicket-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP API process: composition root, OpenAPI, and the Wave 2s slice."
build = "build.rs"

[lints]
workspace = true

[features]
default = []
test-utils = []

[[bin]]
name = "wicket"
path = "src/main.rs"

[dependencies]
wicket-core.workspace = true
wicket-db.workspace = true
wicket-audit.workspace = true
wicket-identity.workspace = true
wicket-numbering.workspace = true
wicket-uom.workspace = true
wicket-events.workspace = true
wicket-jobs.workspace = true
wicket-ledger.workspace = true
wicket-statemachine.workspace = true
wicket-esign.workspace = true
wicket-customfields.workspace = true
wicket-documents.workspace = true
wicket-print.workspace = true
wicket-module.workspace = true
wicket-mod-items = { path = "../../modules/items" }
wicket-mod-locations = { path = "../../modules/locations" }
wicket-mod-lots = { path = "../../modules/lots" }
wicket-mod-inventory = { path = "../../modules/inventory" }
wicket-mod-production-min = { path = "../../modules/production_min" }
wicket-mod-genealogy = { path = "../../modules/genealogy" }
sqlx.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
clap.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true

[dev-dependencies]
wicket-test.workspace = true
tokio.workspace = true
proptest.workspace = true
