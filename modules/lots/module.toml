[module]
id = "mod-lots"
version = "0.1.0"
name = "Lots"
description = "Lot and serial identity, package hierarchy, expiry precision, and UDI attachment"

[dependencies]
kernel = "^0.1"
mod-items = "^0.1"
mod-locations = "^0.1"

[permissions]
"lots.view" = "View lots, serials, and packages"
"lots.edit" = "Create lots, serials, packages, and change status (except release)"
"lots.release" = "Release a lot or serial from quarantine"

[capabilities]
requires-signature = []
regulated = false

[[machines]]
doc_type = "lot"
regulated = false
states = ["quarantine", "available", "hold", "rejected"]

[[machines.edges]]
from = "quarantine"
to = "available"
name = "release"
permission = "lots.release"
required = false
reason = "lot release is not a regulated signature point in Wave 2s.1"

[[machines.edges]]
from = "available"
to = "hold"
name = "hold"
permission = "lots.edit"
reason = "lot status is a business record; inventory posts the movement"

[[machines.edges]]
from = "hold"
to = "available"
name = "unhold"
permission = "lots.edit"
reason = "lot status is a business record; inventory posts the movement"

[[machines.edges]]
from = "quarantine"
to = "rejected"
name = "reject_from_quarantine"
permission = "lots.edit"
reason = "lot status is a business record; inventory posts the movement"

[[machines.edges]]
from = "available"
to = "rejected"
name = "reject"
permission = "lots.edit"
reason = "lot status is a business record; inventory posts the movement"

[[machines.edges]]
from = "hold"
to = "rejected"
name = "reject_from_hold"
permission = "lots.edit"
reason = "lot status is a business record; inventory posts the movement"

[[routes]]
path = "/api/v1/lots"
method = "GET"
permission = "lots.view"

[[routes]]
path = "/api/v1/lots"
method = "POST"
permission = "lots.edit"

[[routes]]
path = "/api/v1/lots/{id}"
method = "GET"
permission = "lots.view"

[[routes]]
path = "/api/v1/lots/{id}/serials"
method = "GET"
permission = "lots.view"

[[routes]]
path = "/api/v1/lots/{id}/serials"
method = "POST"
permission = "lots.edit"

[[routes]]
path = "/api/v1/lots/{id}/status"
method = "POST"
permission = "lots.edit"

[[routes]]
path = "/api/v1/lots/{id}/packages"
method = "GET"
permission = "lots.view"
